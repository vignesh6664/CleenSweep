apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleansweep-client
  labels:
    app: cleansweep-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cleansweep-client
  template:
    metadata:
      labels:
        app: cleansweep-client
    spec:
      containers:
        - name: client
          image: cleansweep-client:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
